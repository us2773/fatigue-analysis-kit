name: API tests

on:
  push:
    branches: ["codex/**"]
    paths: ["api/**", "compose.api.yaml", ".github/workflows/api-tests.yml"]
  pull_request:
    paths: ["api/**", "compose.api.yaml", ".github/workflows/api-tests.yml"]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install './api[test]'
      - run: python -m pytest api/tests -q
      - run: docker compose -f compose.api.yaml config --quiet
