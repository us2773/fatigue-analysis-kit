name: One movie workflow
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash -n run.sh scripts/openface.sh
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pandas==3.0.1
      - run: python -m unittest discover -s fatigued-face-space/tests -p test_one_movie_io.py -v
        env:
          PYTHONPATH: fatigued-face-space/src
